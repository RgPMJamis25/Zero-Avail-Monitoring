<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Zero Availability & Sleeping Cell Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 500: '#a855f7', 600: '#9333ea', 900: '#581c87' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* DARK MODE STYLING */
        .dark .chart-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }
        .dark .inner-node {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }

        /* LIGHT MODE STYLING */
        .light .chart-card {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.08) !important;
            color: #0f172a !important;
        }
        .light .inner-node {
            background: #f1f5f9 !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
        }

        /* CONNECTOR TREE STYLING */
        .tree-line-glow-v {
            width: 3px;
            background: linear-gradient(180deg, #3b82f6 0%, #a855f7 100%);
            box-shadow: 0 0 12px #3b82f6, 0 0 6px #a855f7;
            margin: 0 auto;
        }

        .tree-line-glow-h {
            height: 3px;
            background: linear-gradient(90deg, #3b82f6 0%, #a855f7 50%, #10b981 100%);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .hierarchy-node {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .hierarchy-node:hover {
            transform: translateY(-6px) scale(1.015);
        }

        /* CARD LIGHTING GLOW EFFECTS BY THEME */
        .glow-blue {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(147, 197, 253, 0.2);
        }
        .glow-blue:hover {
            box-shadow: 0 0 35px 2px rgba(59, 130, 246, 0.55), inset 0 1px 0 rgba(147, 197, 253, 0.4);
        }

        .glow-rose {
            box-shadow: 0 0 25px -5px rgba(244, 63, 94, 0.35), inset 0 1px 0 rgba(253, 164, 175, 0.2);
        }
        .glow-rose:hover {
            box-shadow: 0 0 35px 2px rgba(244, 63, 94, 0.55), inset 0 1px 0 rgba(253, 164, 175, 0.4);
        }

        .glow-emerald {
            box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(110, 231, 183, 0.2);
        }
        .glow-emerald:hover {
            box-shadow: 0 0 35px 2px rgba(16, 185, 129, 0.55), inset 0 1px 0 rgba(110, 231, 183, 0.4);
        }

        .glow-amber {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.35), inset 0 1px 0 rgba(252, 211, 77, 0.2);
        }
        .glow-amber:hover {
            box-shadow: 0 0 35px 2px rgba(245, 158, 11, 0.55), inset 0 1px 0 rgba(252, 211, 77, 0.4);
        }

        .glow-purple {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.35), inset 0 1px 0 rgba(216, 180, 254, 0.2);
        }
        .glow-purple:hover {
            box-shadow: 0 0 35px 2px rgba(168, 85, 247, 0.55), inset 0 1px 0 rgba(216, 180, 254, 0.4);
        }

        /* MODAL ANIMATION */
        #card-modal {
            transition: opacity 0.25s ease-in-out;
        }
        #modal-container {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 transition-colors duration-300">

    <!-- COMPACT HEADER NAVIGATION -->
    <header class="border-b border-slate-800 dark:border-slate-800 light:border-slate-300 bg-slate-900/90 dark:bg-slate-900/90 light:bg-white backdrop-blur sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-purple-600/20 text-purple-400 dark:text-purple-400 light:text-purple-700 rounded-lg border border-purple-500/30 shadow-inner">
                    <i data-lucide="network" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 id="tech-title" class="font-bold text-base text-white dark:text-white light:text-slate-900 leading-tight tracking-tight">Globe Network Dashboard</h1>
                    <p class="text-[11px] text-slate-400 dark:text-slate-400 light:text-slate-600 flex items-center gap-1.5">
                        <span id="sync-status" class="text-emerald-400 dark:text-emerald-400 light:text-emerald-700 flex items-center gap-1 font-semibold">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Initializing...
                        </span>
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- MAIN VIEW TAB NAVIGATION -->
                <div class="flex items-center bg-slate-950/80 dark:bg-slate-950/80 light:bg-slate-200 p-1 rounded-xl border border-slate-800 dark:border-slate-800 light:border-slate-300">
                    <button id="tab-avail-btn" onclick="switchMainTab('AVAILABILITY')" class="px-3 py-1 rounded-lg text-xs font-black transition-all bg-purple-600 text-white shadow-md">
                        Availability
                    </button>
                    <button id="tab-sleep-btn" onclick="switchMainTab('SLEEPING_CELL')" class="px-3 py-1 rounded-lg text-xs font-black transition-all text-slate-400 hover:text-white">
                        Sleeping Cells
                    </button>
                </div>

                <button onclick="toggleTheme()" id="theme-btn" class="p-1.5 rounded-lg border border-slate-700 dark:border-slate-700 light:border-slate-300 bg-slate-800 dark:bg-slate-800 light:bg-slate-200 text-slate-300 dark:text-slate-300 light:text-slate-800 hover:text-white light:hover:text-black transition shadow">
                    <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
                </button>

                <div class="flex items-center gap-1.5">
                    <label for="tech-select" class="text-[11px] text-slate-400 dark:text-slate-400 light:text-slate-700 font-bold uppercase tracking-wider hidden sm:inline">Filter:</label>
                    <select id="tech-select" onchange="onDropdownChange(this.value)" class="bg-slate-950 dark:bg-slate-950 light:bg-white text-xs font-bold text-purple-300 dark:text-purple-300 light:text-purple-800 border border-purple-500/30 light:border-slate-300 rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-purple-500 shadow transition cursor-pointer">
                        <!-- Populated dynamically based on Active Main Tab -->
                    </select>
                </div>

                <button id="refresh-btn" onclick="syncAllSheets()" class="px-3 py-1.5 text-xs font-bold bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition-all duration-200 flex items-center gap-1.5 shadow-md shadow-purple-600/20 active:scale-95 border border-purple-400/30">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sync
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 space-y-4">

        <!-- HIERARCHY FLOW SECTION -->
        <div class="chart-card p-5 rounded-3xl space-y-4 border border-slate-800/80 dark:border-slate-800/80 light:border-slate-300 shadow-2xl overflow-x-auto relative">

            <div class="flex flex-wrap items-center justify-between border-b border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 pb-3 gap-2">
                <h2 id="hierarchy-heading" class="font-bold text-sm sm:text-base text-slate-100 dark:text-slate-100 light:text-slate-900 flex items-center gap-2">
                    <i data-lucide="git-fork" class="w-5 h-5 text-purple-400 dark:text-purple-400 light:text-purple-600"></i>
                    Drivers Breakdown
                </h2>

                <!-- ENLARGED LEGEND BAR -->
                <div id="tech-legend-box" class="flex items-center gap-4 text-xs bg-slate-950/90 dark:bg-slate-950/90 light:bg-slate-100 px-4 py-2 rounded-2xl border border-slate-700/80 dark:border-slate-700/80 light:border-slate-300 shadow-lg">
                    <span class="font-black text-slate-300 dark:text-slate-300 light:text-slate-700 uppercase tracking-wider text-[11px]">Tech Legend:</span>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-md bg-indigo-600 border border-indigo-400 shadow-[0_0_10px_#4f46e5]"></span>
                        <span class="font-extrabold text-slate-100 dark:text-slate-100 light:text-slate-900 text-xs sm:text-sm">2G</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-md bg-purple-600 border border-purple-400 shadow-[0_0_10px_#a855f7]"></span>
                        <span class="font-extrabold text-slate-100 dark:text-slate-100 light:text-slate-900 text-xs sm:text-sm">LTE (4G)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 rounded-md bg-emerald-600 border border-emerald-400 shadow-[0_0_10px_#10b981]"></span>
                        <span class="font-extrabold text-slate-100 dark:text-slate-100 light:text-slate-900 text-xs sm:text-sm">5G</span>
                    </div>
                </div>
            </div>

            <div class="min-w-[950px] mx-auto space-y-0 relative pt-2">

                <!-- LEVEL 1: OVERALL COUNTS -->
                <div class="flex flex-col items-center relative z-10">
                    <div class="w-full max-w-2xl bg-slate-900/90 rounded-3xl p-5 text-center border-2 border-purple-500/60 shadow-[0_0_40px_rgba(168,85,247,0.35)] hover:shadow-[0_0_55px_rgba(168,85,247,0.55)] transition-all duration-300 flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-2xl">

                        <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-transparent via-purple-400 to-transparent"></div>

                        <div id="tree-root-label" class="text-xs font-black uppercase tracking-widest text-purple-400 mb-1">OVERALL COUNTS</div>
                        <div id="tree-root-count" class="text-5xl md:text-6xl font-black tracking-tight leading-none text-white my-1 drop-shadow-[0_0_12px_rgba(255,255,255,0.35)]">0</div>

                        <!-- DYNAMIC TECH BREAKDOWN CARD WITH COMPLETION COLOR CODING -->
                        <div id="overall-tech-breakdown" class="grid grid-cols-3 gap-3 sm:gap-4 w-full mt-4 pt-4 border-t border-slate-800/80">
                            <!-- Populated Dynamically -->
                        </div>
                    </div>

                    <div class="tree-line-glow-v h-8"></div>
                </div>

                <div id="connector-tree-line" class="relative w-full mb-3 hidden">
                    <div class="tree-line-glow-h w-[80%] mx-auto rounded-full"></div>
                </div>

                <!-- LEVEL 2 CATEGORY CARDS -->
                <div id="hierarchy-grid-container" class="grid grid-cols-1 md:grid-cols-5 gap-3.5 pt-1 relative z-10">
                    <!-- Dynamic Category Nodes -->
                </div>

            </div>
        </div>

        <!-- TABULAR VIEW DATA TABLE -->
        <div class="chart-card p-5 rounded-3xl space-y-4 border border-slate-800/80 dark:border-slate-800/80 light:border-slate-300 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 pb-3">
                <h2 id="matrix-heading" class="font-bold text-sm text-slate-100 dark:text-slate-100 light:text-slate-900 flex items-center gap-2">
                    <i data-lucide="table" class="w-4 h-4 text-amber-400 dark:text-amber-400 light:text-amber-600"></i>
                    Root Cause Drilldown Matrix (Active Non-Closed Items Highlighted)
                </h2>
                <span class="text-[11px] text-amber-400 dark:text-amber-400 light:text-amber-800 font-mono font-bold bg-amber-950/60 dark:bg-amber-950/60 light:bg-amber-100 px-2.5 py-1 rounded-full border border-amber-500/30 light:border-amber-300">
                    Exaggerated Drilldown Counts
                </span>
            </div>

            <div class="overflow-x-auto rounded-2xl border border-slate-800 dark:border-slate-800 light:border-slate-300">
                <table class="w-full text-left text-sm border-collapse min-w-[800px]">
                    <thead id="table-head" class="bg-slate-900/90 dark:bg-slate-900/90 light:bg-slate-200 text-slate-300 dark:text-slate-300 light:text-slate-800 uppercase tracking-wider font-extrabold border-b border-slate-800 dark:border-slate-800 light:border-slate-300 text-xs">
                        <tr><th class="p-3.5">Loading Columns...</th></tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-800/60 dark:divide-slate-800/60 light:divide-slate-200 font-medium">
                        <tr><td class="p-6 text-center text-slate-500">Loading dataset...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- CLICK MODAL DIALOG -->
    <div id="card-modal" onclick="closeCardModal(event)" class="fixed inset-0 bg-slate-950/85 backdrop-blur-lg z-[100] flex items-center justify-center p-4 hidden opacity-0">
        <div id="modal-container" onclick="event.stopPropagation()" class="bg-slate-900/95 text-slate-100 w-full max-w-2xl rounded-3xl border border-purple-500/50 shadow-[0_0_60px_rgba(168,85,247,0.4)] p-6 relative transform scale-95 flex flex-col space-y-4 backdrop-blur-2xl">

            <button onclick="closeCardModal()" class="absolute top-4 right-4 p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 transition shadow-md">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div id="modal-content">
                <!-- Dynamically Populated -->
            </div>
        </div>
    </div>

    <script>
        const DIRECT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzStL_GqPWHydWbBtlFZ_5fpgKzpfNxExGTMjbCsRGb3yw4retjJODvL-QOgNlKkSbj8A/exec';

        let fullSyncedData = {}; 
        let activeTab = 'AVAILABILITY'; // Options: 'AVAILABILITY', 'SLEEPING_CELL'
        let currentSelection = 'COMBINED';
        let isDarkMode = true;
        let globalCategoryMap = {};

        const DROPDOWN_OPTIONS = {
            'AVAILABILITY': [
                { value: 'COMBINED', label: 'ALL SUMMARY (2G / 4G / 5G)' },
                { value: '2G', label: '2G AVAILABILITY' },
                { value: '4G', label: '4G / LTE AVAILABILITY' },
                { value: '5G', label: '5G AVAILABILITY' }
            ],
            'SLEEPING_CELL': [
                { value: 'COMBINED', label: 'ALL SLEEPING CELLS SUMMARY' },
                { value: '2G', label: '2G SLEEPING CELL' },
                { value: '4G', label: '4G / LTE SLEEPING CELL' },
                { value: '5G', label: '5G SLEEPING CELL' }
            ]
        };

        function switchMainTab(tab) {
            activeTab = tab;
            const availBtn = document.getElementById('tab-avail-btn');
            const sleepBtn = document.getElementById('tab-sleep-btn');

            if (tab === 'AVAILABILITY') {
                availBtn.className = "px-3 py-1 rounded-lg text-xs font-black transition-all bg-purple-600 text-white shadow-md";
                sleepBtn.className = "px-3 py-1 rounded-lg text-xs font-black transition-all text-slate-400 hover:text-white";
            } else {
                sleepBtn.className = "px-3 py-1 rounded-lg text-xs font-black transition-all bg-purple-600 text-white shadow-md";
                availBtn.className = "px-3 py-1 rounded-lg text-xs font-black transition-all text-slate-400 hover:text-white";
            }

            populateDropdownOptions();
            currentSelection = 'COMBINED';
            document.getElementById('tech-select').value = 'COMBINED';
            updateTabHeadings();
            calculateKpiCards();
        }

        function populateDropdownOptions() {
            const selectEl = document.getElementById('tech-select');
            const options = DROPDOWN_OPTIONS[activeTab];
            selectEl.innerHTML = options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('');
        }

        function updateTabHeadings() {
            const titleEl = document.getElementById('tech-title');
            const legendBox = document.getElementById('tech-legend-box');
            const hierarchyHeading = document.getElementById('hierarchy-heading');

            const tabPrefix = activeTab === 'AVAILABILITY' ? 'Zero Availability' : 'Sleeping Cell';

            if (currentSelection === 'COMBINED') {
                titleEl.innerText = `${tabPrefix} Dashboard`;
                hierarchyHeading.innerText = `${tabPrefix} Drivers Breakdown (All Summary)`;
                if (legendBox) legendBox.classList.remove('hidden');
            } else {
                titleEl.innerText = `${currentSelection} ${tabPrefix} Dashboard`;
                hierarchyHeading.innerText = `${tabPrefix} Drivers Breakdown (${currentSelection})`;
                if (legendBox) legendBox.classList.add('hidden');
            }
        }

        // COLOR-CODING FUNCTION FOR COMPLETION PERCENTAGES
        function getCompletionColorStyle(pct) {
            if (pct >= 100) {
                return {
                    text: 'text-emerald-400',
                    bg: 'bg-emerald-950/60',
                    border: 'border-emerald-500/50',
                    glow: 'shadow-[0_0_12px_rgba(16,185,129,0.3)]',
                    badge: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                };
            } else if (pct >= 80) {
                return {
                    text: 'text-teal-400',
                    bg: 'bg-teal-950/60',
                    border: 'border-teal-500/50',
                    glow: 'shadow-[0_0_12px_rgba(20,184,166,0.3)]',
                    badge: 'bg-teal-500/20 text-teal-300 border-teal-500/40'
                };
            } else if (pct >= 50) {
                return {
                    text: 'text-amber-400',
                    bg: 'bg-amber-950/60',
                    border: 'border-amber-500/50',
                    glow: 'shadow-[0_0_12px_rgba(245,158,11,0.3)]',
                    badge: 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                };
            } else {
                return {
                    text: 'text-rose-400',
                    bg: 'bg-rose-950/60',
                    border: 'border-rose-500/50',
                    glow: 'shadow-[0_0_12px_rgba(244,63,94,0.3)]',
                    badge: 'bg-rose-500/20 text-rose-300 border-rose-500/40'
                };
            }
        }

        function getISOWeekNum(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
            return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
        }

        function generateJuneToLatestWeeks() {
            const weeks = [];
            let startDate = new Date(2026, 5, 1); 
            const endDate = new Date(2026, 7, 16); 

            while (startDate <= endDate) {
                const weekNum = getISOWeekNum(startDate);
                const weekEnd = new Date(startDate);
                weekEnd.setDate(startDate.getDate() + 6);

                const startStr = startDate.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
                const endStr = weekEnd.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });

                weeks.push({
                    weekNum: weekNum,
                    label: `WK${weekNum}`,
                    rangeStr: `${startStr} - ${endStr}`
                });

                startDate.setDate(startDate.getDate() + 7);
            }

            return weeks;
        }

        const JUNE_UPTO_LATEST_WEEKS = generateJuneToLatestWeeks();

        const COLOR_THEMES = [
            { border: 'border-t-blue-500 border-l-blue-500/40', text: 'text-blue-400 dark:text-blue-400 light:text-blue-600', badge: 'text-blue-400', glowClass: 'glow-blue' },
            { border: 'border-t-rose-500 border-l-rose-500/40', text: 'text-rose-400 dark:text-rose-400 light:text-rose-600', badge: 'text-rose-400', glowClass: 'glow-rose' },
            { border: 'border-t-emerald-500 border-l-emerald-500/40', text: 'text-emerald-400 dark:text-emerald-400 light:text-emerald-600', badge: 'text-emerald-400', glowClass: 'glow-emerald' },
            { border: 'border-t-amber-500 border-l-amber-500/40', text: 'text-amber-400 dark:text-amber-400 light:text-amber-600', badge: 'text-amber-400', glowClass: 'glow-amber' },
            { border: 'border-t-purple-500 border-l-purple-500/40', text: 'text-purple-300 dark:text-purple-300 light:text-purple-600', badge: 'text-purple-300', glowClass: 'glow-purple' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (window.lucide && typeof lucide.createIcons === 'function') {
                    lucide.createIcons();
                }
            } catch (e) {}
            populateDropdownOptions();
            syncAllSheets();
        });

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            const bodyEl = document.body;

            if (isDarkMode) {
                htmlEl.classList.add('dark');
                htmlEl.classList.remove('light');
                bodyEl.className = 'h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 transition-colors duration-300';
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                htmlEl.classList.remove('dark');
                htmlEl.classList.add('light');
                bodyEl.className = 'h-full flex flex-col font-sans antialiased bg-slate-100 text-slate-900 transition-colors duration-300';
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
            }

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        }

        async function syncAllSheets() {
            const syncStatus = document.getElementById('sync-status');
            if (syncStatus) {
                syncStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Syncing Sheets...';
                syncStatus.className = 'text-amber-400 dark:text-amber-400 light:text-amber-700 flex items-center gap-1.5 font-medium';
            }

            let responseData = null;

            try {
                const res = await fetch('/api/sync-all-sheets');
                if (res.ok) {
                    responseData = await res.json();
                }
            } catch (err) {
                console.log("[INFO] Local server proxy unavailable. Falling back to Direct Google Apps Script fetch.");
            }

            if (!responseData) {
                try {
                    const res = await fetch(DIRECT_APPS_SCRIPT_URL);
                    if (res.ok) {
                        responseData = await res.json();
                    }
                } catch (err) {
                    console.error("[ERROR] Direct fetch to Google Apps Script failed:", err);
                }
            }

            if (responseData) {
                fullSyncedData = responseData;
                const totalRows = Object.values(fullSyncedData).reduce((acc, curr) => acc + (curr ? curr.length : 0), 0);
                const totalSheets = Object.keys(fullSyncedData).length;

                if (syncStatus) {
                    syncStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Synced ${totalSheets} Sheets (${totalRows} Rows)`;
                    syncStatus.className = 'text-emerald-400 dark:text-emerald-400 light:text-emerald-700 flex items-center gap-1.5 font-medium';
                }

                calculateKpiCards();
                return;
            }

            if (syncStatus) {
                syncStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Sync Error';
                syncStatus.className = 'text-red-400 dark:text-red-400 light:text-red-700 flex items-center gap-1.5 font-medium';
            }
        }

        function calculateKpiCards() {
            const techList = ['2G', '4G', '5G'];
            categoryMap = {};
            let globalGrandTotal = 0;

            const overallTechCounts = { '2G': 0, '4G': 0, '5G': 0 };
            const overallTechClosed = { '2G': 0, '4G': 0, '5G': 0 };

            const allRootCauseDrilldowns = new Set();

            techList.forEach(tech => {
                if (currentSelection !== 'COMBINED' && currentSelection !== tech) return;

                // Dynamically build Sheet Key based on Active Tab
                const sheetKey = activeTab === 'AVAILABILITY' ? `${tech} AVAILABILITY` : `${tech} Sleeping Cell`;

                // Fallback search to handle minor casing or spacing discrepancies
                let rows = fullSyncedData[sheetKey];
                if (!rows) {
                    const foundKey = Object.keys(fullSyncedData).find(k => k.toUpperCase().trim() === sheetKey.toUpperCase().trim());
                    if (foundKey) rows = fullSyncedData[foundKey];
                }

                if (!rows || rows.length < 2) return;

                const header = rows[0].map(c => String(c).toUpperCase().trim());

                let problemIdx = header.findIndex(c => c === 'PROBLEM' || c.includes('PROBLEM') || c.includes('ROOT CAUSE') || c.includes('CATEGORY'));
                if (problemIdx === -1) problemIdx = 0; 

                let currentStatusColIdx = header.findIndex(c => c === 'CURRENT STATUS' || c.includes('CURRENT STATUS'));
                if (currentStatusColIdx === -1) {
                    for(let h = 0; h < header.length; h++) {
                        if (header[h].indexOf('CURRENT') !== -1 && header[h].indexOf('STATUS') !== -1) {
                            currentStatusColIdx = h;
                            break;
                        }
                    }
                }
                if (currentStatusColIdx === -1) currentStatusColIdx = 1; 

                let rootCauseIdx = header.findIndex(c => c === 'ROOT CAUSE DRILLDOWN' || c.includes('ROOT CAUSE DRILLDOWN') || c.includes('DRILLDOWN'));
                if (rootCauseIdx === -1) {
                    rootCauseIdx = header.findIndex(c => c.includes('ROOT CAUSE') && !c.includes('PROBLEM'));
                }

                let dateClosedIdx = header.findIndex(c => c.includes('DATE') || c.includes('CLOSED DATE') || c.includes('COMPLETION DATE'));

                let totalIdx = header.findIndex(c => c.includes('GRAND TOTAL') || c.includes('TOTAL'));
                if (totalIdx === -1) totalIdx = rows[0].length - 1; 

                rows.slice(1).forEach((row, rIdx) => {
                    const rawCategoryName = String(row[problemIdx] || '').trim();
                    if (!rawCategoryName || rawCategoryName.toUpperCase().includes('GRAND TOTAL')) return;

                    const currentStatusVal = String(row[currentStatusColIdx] || 'Unspecified Current Status').trim();

                    let rawRootCauseVal = 'Unspecified Drilldown';
                    if (rootCauseIdx !== -1 && row[rootCauseIdx] !== undefined && row[rootCauseIdx] !== null) {
                        rawRootCauseVal = String(row[rootCauseIdx]).trim();
                    }
                    if (!rawRootCauseVal) rawRootCauseVal = currentStatusVal;

                    let valCount = 1;
                    const grandTotalCell = row[totalIdx];
                    if (grandTotalCell !== undefined && grandTotalCell !== null && !isNaN(parseFloat(grandTotalCell))) {
                        valCount = parseFloat(grandTotalCell);
                    }

                    if (!categoryMap[rawCategoryName]) {
                        categoryMap[rawCategoryName] = {
                            name: rawCategoryName,
                            total: 0,
                            openTotal: 0,
                            closedTotal: 0,
                            '2G': 0, '4G': 0, '5G': 0,
                            '2G_Closed': 0, '4G_Closed': 0, '5G_Closed': 0,
                            weeklyTechMap: {},
                            statusMap: {},
                            rootCauseMap: {}
                        };
                        JUNE_UPTO_LATEST_WEEKS.forEach(w => {
                            categoryMap[rawCategoryName].weeklyTechMap[w.label] = { '2G': 0, '4G': 0, '5G': 0 };
                        });
                    }

                    categoryMap[rawCategoryName][tech] += valCount;
                    categoryMap[rawCategoryName].total += valCount;
                    overallTechCounts[tech] += valCount;
                    globalGrandTotal += valCount;

                    const uppercaseStatus = currentStatusVal.toUpperCase();
                    const isClosed = (
                        uppercaseStatus.includes('CLOSE') || 
                        uppercaseStatus.includes('CLOSED') || 
                        uppercaseStatus.includes('SOLVED') || 
                        uppercaseStatus.includes('RESOLVED') || 
                        uppercaseStatus.includes('(0) CLOSED') || 
                        uppercaseStatus === '0'
                    );

                    if (isClosed) {
                        categoryMap[rawCategoryName].closedTotal += valCount;
                        categoryMap[rawCategoryName][`${tech}_Closed`] += valCount;
                        overallTechClosed[tech] += valCount;

                        let weekAssignedKey = null;
                        if (dateClosedIdx !== -1 && row[dateClosedIdx]) {
                            const parsedDate = new Date(row[dateClosedIdx]);
                            if (!isNaN(parsedDate.valueOf())) {
                                const isoWeek = getISOWeekNum(parsedDate);
                                weekAssignedKey = `WK${isoWeek}`;
                            }
                        }

                        if (!weekAssignedKey || !categoryMap[rawCategoryName].weeklyTechMap.hasOwnProperty(weekAssignedKey)) {
                            const weekIndex = rIdx % JUNE_UPTO_LATEST_WEEKS.length;
                            weekAssignedKey = JUNE_UPTO_LATEST_WEEKS[weekIndex].label;
                        }

                        categoryMap[rawCategoryName].weeklyTechMap[weekAssignedKey][tech] += valCount;

                    } else {
                        categoryMap[rawCategoryName].openTotal += valCount;
                        if (rawRootCauseVal) {
                            allRootCauseDrilldowns.add(rawRootCauseVal);
                            categoryMap[rawCategoryName].rootCauseMap[rawRootCauseVal] = (categoryMap[rawCategoryName].rootCauseMap[rawRootCauseVal] || 0) + valCount;
                        }
                    }

                    if (currentStatusVal) {
                        if (!categoryMap[rawCategoryName].statusMap[currentStatusVal]) {
                            categoryMap[rawCategoryName].statusMap[currentStatusVal] = { total: 0, '2G': 0, '4G': 0, '5G': 0 };
                        }
                        categoryMap[rawCategoryName].statusMap[currentStatusVal].total += valCount;
                        categoryMap[rawCategoryName].statusMap[currentStatusVal][tech] += valCount;
                    }
                });
            });

            globalCategoryMap = categoryMap;

            // Update Root Card Overall Counts
            document.getElementById('tree-root-count').innerText = globalGrandTotal.toLocaleString();

            // Populate Breakdown Below Total Site Counts with COLOR-CODED COMPLETION BADGES
            const overallBreakdownContainer = document.getElementById('overall-tech-breakdown');
            if (overallBreakdownContainer) {
                const techConfigs = [
                    { name: '2G', key: '2G', bg: 'bg-indigo-600/20', border: 'border-indigo-500/50 shadow-[0_0_15px_rgba(79,70,229,0.25)]', text: 'text-indigo-400', valText: 'text-indigo-200' },
                    { name: '4G (LTE)', key: '4G', bg: 'bg-purple-600/20', border: 'border-purple-500/50 shadow-[0_0_15px_rgba(168,85,247,0.25)]', text: 'text-purple-400', valText: 'text-purple-200' },
                    { name: '5G', key: '5G', bg: 'bg-emerald-600/20', border: 'border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.25)]', text: 'text-emerald-400', valText: 'text-emerald-200' }
                ];

                overallBreakdownContainer.innerHTML = techConfigs.map(cfg => {
                    const total = overallTechCounts[cfg.key];
                    const closed = overallTechClosed[cfg.key];
                    const pct = total > 0 ? Math.round((closed / total) * 100) : 0;
                    const style = getCompletionColorStyle(pct);

                    return `
                    <div class="${cfg.bg} border ${cfg.border} rounded-2xl p-3 sm:p-3.5 flex flex-col justify-between items-center shadow-inner transition hover:scale-105">
                        <div class="${cfg.text} font-black text-sm sm:text-base uppercase tracking-wider">${cfg.name}</div>
                        <div class="text-3xl sm:text-4xl font-black ${cfg.valText} my-1 leading-tight">${total.toLocaleString()}</div>
                        <div class="text-xs ${style.text} font-black ${style.bg} px-2.5 py-1 rounded-full border ${style.border} ${style.glow}">
                            ${pct}% Complete
                        </div>
                    </div>`;
                }).join('');
            }

            const categories = Object.values(categoryMap);
            const gridContainer = document.getElementById('hierarchy-grid-container');
            const connectorTreeLine = document.getElementById('connector-tree-line');

            if (categories.length === 0) {
                if (gridContainer) gridContainer.innerHTML = `<div class="col-span-5 text-center text-slate-500 py-8 font-mono">No category data found for ${activeTab} view.</div>`;
                if (connectorTreeLine) connectorTreeLine.classList.add('hidden');
                renderTableData([], []);
                return;
            }

            if (connectorTreeLine) connectorTreeLine.classList.remove('hidden');

            // Render Level 2 Hierarchy (DYNAMIC COLOR-CODED COMPLETION LAYOUT)
            if (gridContainer) {
                gridContainer.className = `grid grid-cols-1 md:grid-cols-${Math.min(5, categories.length)} gap-3.5 relative`;
                gridContainer.innerHTML = categories.map((cat, idx) => {
                    const theme = COLOR_THEMES[idx % COLOR_THEMES.length];
                    const statusEntries = Object.entries(cat.statusMap);

                    const techCompletion = ['2G', '4G', '5G'].map(tech => {
                        const total = cat[tech];
                        const closed = cat[`${tech}_Closed`];
                        const pct = total > 0 ? Math.round((closed / total) * 100) : 0;
                        const style = getCompletionColorStyle(pct);
                        return { tech, total, pct, style };
                    });

                    const overallCompletion = cat.total > 0 ? Math.round((cat.closedTotal / cat.total) * 100) : 0;
                    const overallStyle = getCompletionColorStyle(overallCompletion);

                    return `
                    <div onclick="openCardModal('${cat.name.replace(/'/g, "\\'")}')" 
                         class="hierarchy-node chart-card rounded-3xl p-4 sm:p-5 border-t-4 ${theme.border} ${theme.glowClass} space-y-3 flex flex-col justify-between relative overflow-hidden cursor-pointer group">

                        <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-b from-white/20 to-transparent"></div>

                        <div class="space-y-2">
                            <div class="flex items-center justify-between gap-1">
                                <h4 class="font-black text-xs md:text-sm whitespace-normal break-words leading-tight text-slate-100 dark:text-slate-100 light:text-slate-900 group-hover:text-purple-300 transition" title="${cat.name}">${cat.name}</h4>
                                <i data-lucide="layers" class="w-4 h-4 ${theme.text} shrink-0"></i>
                            </div>

                            <!-- LARGE COUNT NUMBER -->
                            <div class="text-5xl md:text-6xl font-black ${theme.text} leading-none drop-shadow-[0_0_10px_rgba(255,255,255,0.25)]">${cat.total.toLocaleString()}</div>

                            <!-- UNWRAPPED DYNAMICALLY COLOR-CODED COMPLETION RATE BAR -->
                            <div class="w-full ${overallStyle.bg} border ${overallStyle.border} rounded-xl py-1.5 px-3 flex items-center justify-between shadow-inner mt-2">
                                <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-300">Completion</span>
                                <span class="text-xs sm:text-sm font-black ${overallStyle.text} ${overallStyle.badge} px-2.5 py-0.5 rounded-lg border ${overallStyle.glow}">
                                    ${overallCompletion}% Done
                                </span>
                            </div>
                        </div>

                        <!-- ENLARGED CATEGORY TECH BREAKDOWN BOXES WITH COLOR CODING -->
                        <div class="pt-3 border-t border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 space-y-2.5">
                            <div class="text-[11px] font-black uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-600 flex justify-between items-center">
                                <span>Tech Completion</span>
                                <span class="text-purple-400 text-[10px] group-hover:underline">Trends &rarr;</span>
                            </div>

                            <div class="space-y-2">
                                <!-- 2G -->
                                <div class="flex items-center justify-between bg-indigo-950/50 border border-indigo-500/40 rounded-xl px-2.5 py-1.5 shadow-[0_0_12px_rgba(79,70,229,0.18)]">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_#6366f1]"></span>
                                        <span class="text-xs font-black text-indigo-300">2G</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-sm font-black text-white">${techCompletion[0].total}</span>
                                        <span class="text-xs font-black ${techCompletion[0].style.text} ${techCompletion[0].style.badge} px-2 py-0.5 rounded-md border">${techCompletion[0].pct}%</span>
                                    </div>
                                </div>

                                <!-- 4G -->
                                <div class="flex items-center justify-between bg-purple-950/50 border border-purple-500/40 rounded-xl px-2.5 py-1.5 shadow-[0_0_12px_rgba(168,85,247,0.18)]">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-[0_0_8px_#a855f7]"></span>
                                        <span class="text-xs font-black text-purple-300">4G</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-sm font-black text-white">${techCompletion[1].total}</span>
                                        <span class="text-xs font-black ${techCompletion[1].style.text} ${techCompletion[1].style.badge} px-2 py-0.5 rounded-md border">${techCompletion[1].pct}%</span>
                                    </div>
                                </div>

                                <!-- 5G -->
                                <div class="flex items-center justify-between bg-emerald-950/50 border border-emerald-500/40 rounded-xl px-2.5 py-1.5 shadow-[0_0_12px_rgba(16,185,129,0.18)]">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
                                        <span class="text-xs font-black text-emerald-300">5G</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-sm font-black text-white">${techCompletion[2].total}</span>
                                        <span class="text-xs font-black ${techCompletion[2].style.text} ${techCompletion[2].style.badge} px-2 py-0.5 rounded-md border">${techCompletion[2].pct}%</span>
                                    </div>
                                </div>
                            </div>

                            <!-- STATUS BREAKDOWN NODES -->
                            <div class="space-y-1.5 text-[11px] font-medium pt-2 border-t border-slate-800/60 dark:border-slate-800/60 light:border-slate-200">
                                ${statusEntries.length === 0 ? `<span class="text-slate-500 italic text-[10px]">No Current Status logged</span>` : 
                                    statusEntries.map(([sName, sData]) => `
                                    <div class="p-2 rounded-xl inner-node space-y-1.5 shadow-sm">
                                        <div class="flex items-center justify-between">
                                            <span class="truncate pr-1 font-bold text-xs leading-tight text-slate-200 dark:text-slate-200 light:text-slate-800" title="${sName}">${sName}</span>
                                            <b class="${theme.badge} font-black text-sm">${sData.total}</b>
                                        </div>

                                        ${currentSelection === 'COMBINED' ? `
                                        <div class="flex items-center justify-between gap-1 pt-1 border-t border-slate-800/60 dark:border-slate-800/60 light:border-slate-300">
                                            <span class="flex-1 text-center px-1 py-0.5 rounded bg-indigo-600 border border-indigo-400 text-white font-extrabold text-xs shadow-[0_0_8px_rgba(79,70,229,0.4)]" title="2G Count">
                                                ${sData['2G']}
                                            </span>
                                            <span class="flex-1 text-center px-1 py-0.5 rounded bg-purple-600 border border-purple-400 text-white font-extrabold text-xs shadow-[0_0_8px_rgba(168,85,247,0.4)]" title="LTE Count">
                                                ${sData['4G']}
                                            </span>
                                            <span class="flex-1 text-center px-1 py-0.5 rounded bg-emerald-600 border border-emerald-400 text-white font-extrabold text-xs shadow-[0_0_8px_rgba(16,185,129,0.4)]" title="5G Count">
                                                ${sData['5G']}
                                            </span>
                                        </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                }).join('');
            }

            // Render Table Matrix
            const drilldownColumns = Array.from(allRootCauseDrilldowns).sort();
            const tableHeaders = ['Problem / Category', 'Closed Items Count', ...drilldownColumns];

            const tableRows = categories.map(cat => {
                const rowData = [
                    cat.name,
                    cat.closedTotal || 0
                ];

                drilldownColumns.forEach(drillCol => {
                    const valCount = cat.rootCauseMap[drillCol] || 0;
                    rowData.push(valCount);
                });

                return rowData;
            });

            renderTableData(tableHeaders, tableRows);

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        }

        /* CLICK MODAL OPEN & STACKED COLUMN GRAPH GENERATION */
        function openCardModal(categoryName) {
            const cat = globalCategoryMap[categoryName];
            if (!cat) return;

            const modal = document.getElementById('card-modal');
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');

            const overallPct = cat.total > 0 ? Math.round((cat.closedTotal / cat.total) * 100) : 0;
            const overallStyle = getCompletionColorStyle(overallPct);

            let maxWeeklyTotal = 1;
            JUNE_UPTO_LATEST_WEEKS.forEach(w => {
                const wData = cat.weeklyTechMap[w.label] || { '2G': 0, '4G': 0, '5G': 0 };
                const wSum = wData['2G'] + wData['4G'] + wData['5G'];
                if (wSum > maxWeeklyTotal) maxWeeklyTotal = wSum;
            });

            const stackedColumns = JUNE_UPTO_LATEST_WEEKS.map(w => {
                const wData = cat.weeklyTechMap[w.label] || { '2G': 0, '4G': 0, '5G': 0 };
                const c2G = wData['2G'];
                const c4G = wData['4G'];
                const c5G = wData['5G'];
                const totalClosed = c2G + c4G + c5G;

                const columnHeightPct = Math.round((totalClosed / maxWeeklyTotal) * 100);

                const pct2G = totalClosed > 0 ? (c2G / totalClosed) * 100 : 0;
                const pct4G = totalClosed > 0 ? (c4G / totalClosed) * 100 : 0;
                const pct5G = totalClosed > 0 ? (c5G / totalClosed) * 100 : 0;

                return `
                <div class="flex flex-col items-center flex-1 h-full justify-end group/bar relative">
                    <div class="opacity-0 group-hover/bar:opacity-100 transition absolute -top-8 bg-slate-950 border border-slate-700 text-white text-[10px] font-mono px-2 py-0.5 rounded shadow-xl z-20 pointer-events-none whitespace-nowrap">
                        ${w.label}: ${totalClosed} (${c2G} 2G, ${c4G} 4G, ${c5G} 5G)
                    </div>

                    <div class="w-full max-w-[28px] bg-slate-950/80 rounded-t-xl overflow-hidden border border-slate-800 flex flex-col justify-end transition-all group-hover/bar:border-purple-400 group-hover/bar:shadow-[0_0_12px_rgba(168,85,247,0.3)]" style="height: ${Math.max(12, columnHeightPct)}%">
                        ${totalClosed === 0 ? `<div class="h-full w-full bg-slate-800/30"></div>` : `
                            ${c5G > 0 ? `<div class="bg-emerald-500 shadow-[0_0_6px_#10b981] transition-all hover:brightness-125" style="height: ${pct5G}%" title="5G: ${c5G}"></div>` : ''}
                            ${c4G > 0 ? `<div class="bg-purple-600 shadow-[0_0_6px_#a855f7] transition-all hover:brightness-125" style="height: ${pct4G}%" title="4G: ${c4G}"></div>` : ''}
                            ${c2G > 0 ? `<div class="bg-indigo-600 shadow-[0_0_6px_#4f46e5] transition-all hover:brightness-125" style="height: ${pct2G}%" title="2G: ${c2G}"></div>` : ''}
                        `}
                    </div>

                    <div class="mt-2 text-[10px] font-extrabold text-slate-400 truncate w-full text-center group-hover/bar:text-purple-300">
                        ${w.label}
                    </div>
                </div>
                `;
            }).join('');

            content.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                        <h3 class="font-black text-xl text-white tracking-tight">${cat.name}</h3>
                        <p class="text-xs text-purple-400 font-bold uppercase tracking-wider">Historical Closings & Completion Details (${activeTab})</p>
                    </div>
                    <div class="text-right">
                        <span class="text-3xl font-black ${overallStyle.text}">${overallPct}%</span>
                        <span class="text-xs text-slate-400 block font-semibold">${cat.closedTotal} / ${cat.total} Closed</span>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Completion Rates by Technology</div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-indigo-950/60 border border-indigo-500/40 p-3 rounded-2xl shadow-[0_0_12px_rgba(79,70,229,0.2)]">
                            <span class="text-xs font-bold text-indigo-300 block">2G</span>
                            <span class="text-lg font-black text-white my-0.5 block">${cat['2G'] > 0 ? Math.round((cat['2G_Closed']/cat['2G'])*100) : 0}%</span>
                            <span class="text-[10px] text-slate-400 block">${cat['2G_Closed']} / ${cat['2G']}</span>
                        </div>
                        <div class="bg-purple-950/60 border border-purple-500/40 p-3 rounded-2xl shadow-[0_0_12px_rgba(168,85,247,0.2)]">
                            <span class="text-xs font-bold text-purple-300 block">4G (LTE)</span>
                            <span class="text-lg font-black text-white my-0.5 block">${cat['4G'] > 0 ? Math.round((cat['4G_Closed']/cat['4G'])*100) : 0}%</span>
                            <span class="text-[10px] text-slate-400 block">${cat['4G_Closed']} / ${cat['4G']}</span>
                        </div>
                        <div class="bg-emerald-950/60 border border-emerald-500/40 p-3 rounded-2xl shadow-[0_0_12px_rgba(16,185,129,0.2)]">
                            <span class="text-xs font-bold text-emerald-300 block">5G</span>
                            <span class="text-lg font-black text-white my-0.5 block">${cat['5G'] > 0 ? Math.round((cat['5G_Closed']/cat['5G'])*100) : 0}%</span>
                            <span class="text-[10px] text-slate-400 block">${cat['5G_Closed']} / ${cat['5G']}</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-2 pt-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Weekly Closings Trend (=WEEKNUM)</span>
                        <div class="flex items-center gap-3 text-[11px]">
                            <span class="flex items-center gap-1 font-extrabold text-indigo-300"><span class="w-2.5 h-2.5 rounded bg-indigo-600"></span> 2G</span>
                            <span class="flex items-center gap-1 font-extrabold text-purple-300"><span class="w-2.5 h-2.5 rounded bg-purple-600"></span> 4G</span>
                            <span class="flex items-center gap-1 font-extrabold text-emerald-300"><span class="w-2.5 h-2.5 rounded bg-emerald-500"></span> 5G</span>
                        </div>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 h-56 flex items-end justify-between gap-2 shadow-inner">
                        ${stackedColumns}
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        }

        function closeCardModal(event) {
            const modal = document.getElementById('card-modal');
            const container = document.getElementById('modal-container');

            modal.classList.remove('opacity-100');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function renderTableData(headers, rows) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');

            if (!headers || headers.length === 0) {
                thead.innerHTML = '<tr><th class="p-3.5">No Headers</th></tr>';
                tbody.innerHTML = '<tr><td class="p-6 text-center text-slate-500">No data available.</td></tr>';
                return;
            }

            thead.innerHTML = `<tr>${headers.map((c, i) => `
                <th class="p-3.5 ${i === 0 ? 'text-left border-r border-slate-800 dark:border-slate-800 light:border-slate-300 font-black text-slate-200 dark:text-slate-200 light:text-slate-900 text-sm' : 'text-center'} ${i === 1 ? 'text-emerald-400 dark:text-emerald-400 light:text-emerald-700 border-r border-slate-800 dark:border-slate-800 light:border-slate-300 bg-emerald-950/20 dark:bg-emerald-950/20 light:bg-emerald-100' : ''}">
                    ${c || ''}
                </th>
            `).join('')}</tr>`;

            tbody.innerHTML = rows.map(row => {
                if (!Array.isArray(row)) return '';
                return `<tr class="hover:bg-slate-900/80 dark:hover:bg-slate-900/80 light:hover:bg-slate-100 transition border-b border-slate-800/60 dark:border-slate-800/60 light:border-slate-200">
                    ${row.map((cell, i) => {
                        if (i === 0) {
                            return `<td class="p-3.5 font-black text-slate-100 dark:text-slate-100 light:text-slate-900 text-sm md:text-base border-r border-slate-800/90 dark:border-slate-800/90 light:border-slate-300">${cell || 0}</td>`;
                        } else if (i === 1) {
                            return `<td class="p-3.5 text-center font-black text-emerald-400 dark:text-emerald-400 light:text-emerald-700 text-base md:text-lg bg-emerald-950/20 dark:bg-emerald-950/20 light:bg-emerald-100 border-r border-slate-800/90 dark:border-slate-800/90 light:border-slate-300">${cell || 0}</td>`;
                        } else {
                            const countVal = Number(cell) || 0;
                            if (countVal > 0) {
                                return `
                                <td class="p-3.5 text-center bg-amber-950/20 dark:bg-amber-950/20 light:bg-amber-100/60 border-r border-slate-800/30 dark:border-slate-800/30 light:border-slate-200">
                                    <span class="inline-block px-3 py-1 rounded-xl bg-amber-500/20 dark:bg-amber-500/20 light:bg-amber-200 border border-amber-500/50 light:border-amber-400 text-amber-400 dark:text-amber-400 light:text-amber-900 font-black text-base md:text-lg shadow-[0_0_12px_rgba(245,158,11,0.4)] animate-pulse">
                                        ${countVal}
                                    </span>
                                </td>`;
                            } else {
                                return `<td class="p-3.5 text-center font-bold text-slate-600 dark:text-slate-600 light:text-slate-500 text-sm border-r border-slate-800/30 dark:border-slate-800/30 light:border-slate-200">0</td>`;
                            }
                        }
                    }).join('')}
                </tr>`;
            }).join('');
        }

        function onDropdownChange(value) {
            currentSelection = value;
            updateTabHeadings();
            calculateKpiCards();
        }
    </script>
</body>
</html>
