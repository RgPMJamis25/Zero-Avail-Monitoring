<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Zero Availability Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 500: '#a855f7', 600: '#9333ea', 900: '#581c87' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* DARK MODE STYLING */
        .dark .chart-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }
        .dark .inner-node {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }
        .dark .root-card {
            background: rgba(30, 41, 59, 0.95);
            border-top: 4px solid #a855f7;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* LIGHT MODE HIGH CONTRAST STYLING */
        .light .chart-card {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08) !important;
            color: #0f172a !important;
        }
        .light .inner-node {
            background: #f1f5f9 !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
        }
        .light .root-card {
            background: #ffffff !important;
            border-top: 4px solid #9333ea !important;
            border-left: 1px solid #cbd5e1 !important;
            border-right: 1px solid #cbd5e1 !important;
            border-bottom: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1) !important;
        }

        /* COMPACT CONNECTOR TREE STYLING */
        .tree-line-v {
            width: 2px;
            background-color: #2563eb;
            margin: 0 auto;
        }
        .hierarchy-node {
            transition: all 0.2s ease;
        }
        .hierarchy-node:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 transition-colors duration-300">

    <!-- COMPACT HEADER NAVIGATION -->
    <header class="border-b border-slate-800 dark:border-slate-800 light:border-slate-300 bg-slate-900/90 dark:bg-slate-900/90 light:bg-white backdrop-blur sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-purple-600/20 text-purple-400 dark:text-purple-400 light:text-purple-700 rounded-lg border border-purple-500/30 shadow-inner">
                    <i data-lucide="network" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 id="tech-title" class="font-bold text-base text-white dark:text-white light:text-slate-900 leading-tight tracking-tight">Zero Availability Dashboard</h1>
                    <p class="text-[11px] text-slate-400 dark:text-slate-400 light:text-slate-600 flex items-center gap-1.5">
                        <span id="sync-status" class="text-emerald-400 dark:text-emerald-400 light:text-emerald-700 flex items-center gap-1 font-semibold">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Initializing...
                        </span>
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <!-- LIGHT / DARK MODE TOGGLE BUTTON -->
                <button onclick="toggleTheme()" id="theme-btn" class="p-1.5 rounded-lg border border-slate-700 dark:border-slate-700 light:border-slate-300 bg-slate-800 dark:bg-slate-800 light:bg-slate-200 text-slate-300 dark:text-slate-300 light:text-slate-800 hover:text-white light:hover:text-black transition shadow">
                    <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
                </button>

                <!-- DROPDOWN SELECTOR -->
                <div class="flex items-center gap-1.5">
                    <label for="tech-select" class="text-[11px] text-slate-400 dark:text-slate-400 light:text-slate-700 font-bold uppercase tracking-wider hidden sm:inline">View:</label>
                    <select id="tech-select" onchange="onDropdownChange(this.value)" class="bg-slate-950 dark:bg-slate-950 light:bg-white text-xs font-bold text-purple-300 dark:text-purple-300 light:text-purple-800 border border-purple-500/30 light:border-slate-300 rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-purple-500 shadow transition cursor-pointer">
                        <option value="COMBINED">ALL SUMMARY (2G / 4G / 5G)</option>
                        <option value="2G">2G AVAILABILITY</option>
                        <option value="4G">4G / LTE AVAILABILITY</option>
                        <option value="5G">5G AVAILABILITY</option>
                    </select>
                </div>

                <button id="refresh-btn" onclick="syncAllSheets()" class="px-3 py-1.5 text-xs font-bold bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition-all duration-200 flex items-center gap-1.5 shadow-md shadow-purple-600/20 active:scale-95 border border-purple-400/30">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sync
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 space-y-4">

        <!-- TOP KPI CARDS -->
        <div id="top-kpi-container">
            <!-- Populated Dynamically -->
        </div>

        <!-- HIERARCHY FLOW SECTION -->
        <div class="chart-card p-5 rounded-2xl space-y-4 border border-slate-800/80 dark:border-slate-800/80 light:border-slate-300 shadow-xl overflow-x-auto">

            <!-- HEADER & COLOR LEGEND -->
            <div class="flex flex-wrap items-center justify-between border-b border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 pb-3 gap-2">
                <h2 id="hierarchy-heading" class="font-bold text-sm text-slate-100 dark:text-slate-100 light:text-slate-900 flex items-center gap-2">
                    <i data-lucide="git-fork" class="w-4 h-4 text-blue-400 dark:text-blue-400 light:text-blue-600"></i>
                    Availability Drivers Breakdown
                </h2>

                <!-- COLOR-CODED LEGEND -->
                <div id="tech-legend-box" class="flex items-center gap-3 text-[11px] bg-slate-950 dark:bg-slate-950 light:bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-800 dark:border-slate-800 light:border-slate-300 shadow-inner">
                    <span class="font-bold text-slate-400 dark:text-slate-400 light:text-slate-600 uppercase tracking-wider text-[9px]">Tech Legend:</span>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded bg-indigo-600 border border-indigo-400 shadow"></span>
                        <span class="font-bold text-slate-200 dark:text-slate-200 light:text-slate-800">2G</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded bg-purple-600 border border-purple-400 shadow"></span>
                        <span class="font-bold text-slate-200 dark:text-slate-200 light:text-slate-800">LTE</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded bg-emerald-600 border border-emerald-400 shadow"></span>
                        <span class="font-bold text-slate-200 dark:text-slate-200 light:text-slate-800">5G</span>
                    </div>
                </div>
            </div>

            <div class="min-w-[950px] mx-auto space-y-0">

                <!-- LEVEL 1: HIGH CONTRAST ROOT CARD -->
                <div class="flex flex-col items-center">
                    <div class="w-52 root-card rounded-2xl p-3 text-center shadow-xl flex flex-col items-center justify-center">
                        <div id="tree-root-label" class="text-[10px] font-black uppercase tracking-widest text-purple-400 dark:text-purple-400 light:text-purple-700 mb-1">OVERALL COUNTS</div>
                        <div id="tree-root-count" class="text-4xl font-black tracking-tight leading-none text-slate-100 dark:text-slate-100 light:text-slate-900">0</div>
                    </div>
                    <div class="tree-line-v h-5"></div>
                </div>

                <!-- HIERARCHY GRID CONTAINER -->
                <div id="hierarchy-grid-container" class="grid grid-cols-1 md:grid-cols-5 gap-3 pt-1">
                    <!-- Dynamic Category Nodes & Status Nodes -->
                </div>

            </div>
        </div>

        <!-- TABULAR VIEW DATA TABLE -->
        <div class="chart-card p-5 rounded-2xl space-y-4 border border-slate-800/80 dark:border-slate-800/80 light:border-slate-300 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 pb-3">
                <h2 id="matrix-heading" class="font-bold text-sm text-slate-100 dark:text-slate-100 light:text-slate-900 flex items-center gap-2">
                    <i data-lucide="table" class="w-4 h-4 text-amber-400 dark:text-amber-400 light:text-amber-600"></i>
                    Root Cause Drilldown Matrix (Active Non-Closed Items Highlighted)
                </h2>
                <span class="text-[11px] text-amber-400 dark:text-amber-400 light:text-amber-800 font-mono font-bold bg-amber-950/60 dark:bg-amber-950/60 light:bg-amber-100 px-2.5 py-1 rounded-full border border-amber-500/30 light:border-amber-300">
                    Exaggerated Drilldown Counts
                </span>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-800 dark:border-slate-800 light:border-slate-300">
                <table class="w-full text-left text-sm border-collapse min-w-[800px]">
                    <thead id="table-head" class="bg-slate-900/90 dark:bg-slate-900/90 light:bg-slate-200 text-slate-300 dark:text-slate-300 light:text-slate-800 uppercase tracking-wider font-extrabold border-b border-slate-800 dark:border-slate-800 light:border-slate-300 text-xs">
                        <tr><th class="p-3.5">Loading Columns...</th></tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-800/60 dark:divide-slate-800/60 light:divide-slate-200 font-medium">
                        <tr><td class="p-6 text-center text-slate-500">Loading dataset...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let fullSyncedData = {}; 
        let currentSelection = 'COMBINED';
        let isDarkMode = true;

        const COLOR_THEMES = [
            { border: 'border-l-blue-500 border-t-blue-500', text: 'text-blue-400 dark:text-blue-400 light:text-blue-600', badge: 'text-blue-400 dark:text-blue-400 light:text-blue-600' },
            { border: 'border-l-rose-500 border-t-rose-500', text: 'text-rose-400 dark:text-rose-400 light:text-rose-600', badge: 'text-rose-400 dark:text-rose-400 light:text-rose-600' },
            { border: 'border-l-emerald-500 border-t-emerald-500', text: 'text-emerald-400 dark:text-emerald-400 light:text-emerald-600', badge: 'text-emerald-400 dark:text-emerald-400 light:text-emerald-600' },
            { border: 'border-l-amber-500 border-t-amber-500', text: 'text-amber-400 dark:text-amber-400 light:text-amber-600', badge: 'text-amber-400 dark:text-amber-400 light:text-amber-600' },
            { border: 'border-l-purple-500 border-t-purple-500', text: 'text-purple-300 dark:text-purple-300 light:text-purple-600', badge: 'text-purple-300 dark:text-purple-300 light:text-purple-600' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (window.lucide && typeof lucide.createIcons === 'function') {
                    lucide.createIcons();
                }
            } catch (e) {}
            syncAllSheets();
        });

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            const bodyEl = document.body;

            if (isDarkMode) {
                htmlEl.classList.add('dark');
                htmlEl.classList.remove('light');
                bodyEl.className = 'h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 transition-colors duration-300';
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                htmlEl.classList.remove('dark');
                htmlEl.classList.add('light');
                bodyEl.className = 'h-full flex flex-col font-sans antialiased bg-slate-100 text-slate-900 transition-colors duration-300';
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
            }

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        }

        async function syncAllSheets() {
            const syncStatus = document.getElementById('sync-status');
            if (syncStatus) {
                syncStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Syncing Sheets...';
                syncStatus.className = 'text-amber-400 dark:text-amber-400 light:text-amber-700 flex items-center gap-1.5 font-medium';
            }

            try {
                const res = await fetch('/api/sync-all-sheets');
                if (res.ok) {
                    fullSyncedData = await res.json();

                    const totalRows = Object.values(fullSyncedData).reduce((acc, curr) => acc + (curr ? curr.length : 0), 0);

                    if (syncStatus) {
                        syncStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Synced 3 Sheets (${totalRows} Rows)`;
                        syncStatus.className = 'text-emerald-400 dark:text-emerald-400 light:text-emerald-700 flex items-center gap-1.5 font-medium';
                    }

                    calculateKpiCards();
                    return;
                }
            } catch (err) {
                console.error("Sync Error:", err);
            }

            if (syncStatus) {
                syncStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Sync Error';
                syncStatus.className = 'text-red-400 dark:text-red-400 light:text-red-700 flex items-center gap-1.5 font-medium';
            }
        }

        function calculateKpiCards() {
            const techList = ['2G', '4G', '5G'];
            const categoryMap = {};
            let globalGrandTotal = 0;

            const allRootCauseDrilldowns = new Set();

            // 1. EXTRACT CATEGORIES, CURRENT STATUS, & ROOT CAUSE DRILLDOWN
            techList.forEach(tech => {
                if (currentSelection !== 'COMBINED' && currentSelection !== tech) return;

                const sheetKey = `${tech} AVAILABILITY`;
                const rows = fullSyncedData[sheetKey] || [];
                if (rows.length < 2) return;

                const header = rows[0].map(c => String(c).toUpperCase().trim());

                // Find Category Column (Col A / Index 0)
                let problemIdx = header.findIndex(c => c === 'PROBLEM' || c.includes('PROBLEM') || c.includes('ROOT CAUSE') || c.includes('CATEGORY'));
                if (problemIdx === -1) problemIdx = 0; 

                // Find CURRENT STATUS Column strictly
                let currentStatusColIdx = header.findIndex(c => c === 'CURRENT STATUS' || c.includes('CURRENT STATUS'));
                if (currentStatusColIdx === -1) {
                    for(let h = 0; h < header.length; h++) {
                        if (header[h].indexOf('CURRENT') !== -1 && header[h].indexOf('STATUS') !== -1) {
                            currentStatusColIdx = h;
                            break;
                        }
                    }
                }
                if (currentStatusColIdx === -1) currentStatusColIdx = 1; 

                // LOCATE 'ROOT CAUSE DRILLDOWN' COLUMN EXPLICITLY
                let rootCauseIdx = header.findIndex(c => c === 'ROOT CAUSE DRILLDOWN' || c.includes('ROOT CAUSE DRILLDOWN') || c.includes('DRILLDOWN'));
                if (rootCauseIdx === -1) {
                    rootCauseIdx = header.findIndex(c => c.includes('ROOT CAUSE') && !c.includes('PROBLEM'));
                }

                // Find Grand Total Column
                let totalIdx = header.findIndex(c => c.includes('GRAND TOTAL') || c.includes('TOTAL'));
                if (totalIdx === -1) totalIdx = rows[0].length - 1; 

                rows.slice(1).forEach(row => {
                    const rawCategoryName = String(row[problemIdx] || '').trim();
                    if (!rawCategoryName || rawCategoryName.toUpperCase().includes('GRAND TOTAL')) return;

                    const currentStatusVal = String(row[currentStatusColIdx] || 'Unspecified Current Status').trim();

                    let rawRootCauseVal = 'Unspecified Drilldown';
                    if (rootCauseIdx !== -1 && row[rootCauseIdx] !== undefined && row[rootCauseIdx] !== null) {
                        rawRootCauseVal = String(row[rootCauseIdx]).trim();
                    }
                    if (!rawRootCauseVal) rawRootCauseVal = currentStatusVal;

                    let valCount = 1;
                    const grandTotalCell = row[totalIdx];
                    if (grandTotalCell !== undefined && grandTotalCell !== null && !isNaN(parseFloat(grandTotalCell))) {
                        valCount = parseFloat(grandTotalCell);
                    }

                    if (!categoryMap[rawCategoryName]) {
                        categoryMap[rawCategoryName] = {
                            name: rawCategoryName,
                            total: 0,
                            openTotal: 0,
                            closedTotal: 0,
                            '2G': 0, '4G': 0, '5G': 0,
                            statusMap: {},
                            rootCauseMap: {}
                        };
                    }

                    categoryMap[rawCategoryName][tech] += valCount;
                    categoryMap[rawCategoryName].total += valCount;
                    globalGrandTotal += valCount;

                    // MATCH CLOSED ITEMS ('CLOSE', 'CLOSED', 'SOLVED', 'RESOLVED', '0')
                    const uppercaseStatus = currentStatusVal.toUpperCase();
                    const isClosed = (
                        uppercaseStatus.includes('CLOSE') || 
                        uppercaseStatus.includes('CLOSED') || 
                        uppercaseStatus.includes('SOLVED') || 
                        uppercaseStatus.includes('RESOLVED') || 
                        uppercaseStatus.includes('(0) CLOSED') || 
                        uppercaseStatus === '0'
                    );

                    if (isClosed) {
                        categoryMap[rawCategoryName].closedTotal += valCount;
                    } else {
                        categoryMap[rawCategoryName].openTotal += valCount;

                        // Collect non-closed root cause drilldowns for table matrix columns
                        if (rawRootCauseVal) {
                            allRootCauseDrilldowns.add(rawRootCauseVal);
                            categoryMap[rawCategoryName].rootCauseMap[rawRootCauseVal] = (categoryMap[rawCategoryName].rootCauseMap[rawRootCauseVal] || 0) + valCount;
                        }
                    }

                    // Level 3: CURRENT STATUS mapping for tree
                    if (currentStatusVal) {
                        if (!categoryMap[rawCategoryName].statusMap[currentStatusVal]) {
                            categoryMap[rawCategoryName].statusMap[currentStatusVal] = { total: 0, '2G': 0, '4G': 0, '5G': 0 };
                        }
                        categoryMap[rawCategoryName].statusMap[currentStatusVal].total += valCount;
                        categoryMap[rawCategoryName].statusMap[currentStatusVal][tech] += valCount;
                    }
                });
            });

            // Update Tier 1 Overall Counts
            document.getElementById('tree-root-count').innerText = globalGrandTotal.toLocaleString();

            const categories = Object.values(categoryMap);
            const kpiContainer = document.getElementById('top-kpi-container');
            const gridContainer = document.getElementById('hierarchy-grid-container');

            if (categories.length === 0) {
                if (kpiContainer) kpiContainer.innerHTML = `<div class="col-span-5 text-center text-slate-500 py-3 font-mono">No category data found.</div>`;
                if (gridContainer) gridContainer.innerHTML = `<div class="col-span-5 text-center text-slate-500 py-4 font-mono">No category data found for selection.</div>`;
                renderTableData([], []);
                return;
            }

            // 2. RENDER KPI CARDS WITH HIGH CONTRAST IN LIGHT MODE
            if (kpiContainer) {
                kpiContainer.className = `grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-${Math.min(5, categories.length)} gap-3.5`;
                kpiContainer.innerHTML = categories.map((cat, idx) => {
                    const theme = COLOR_THEMES[idx % COLOR_THEMES.length];

                    let completionPct = 100;
                    if (cat.total > 0) {
                        completionPct = Math.round((cat.closedTotal / cat.total) * 100);
                    }

                    let badgeStyleClass = "";
                    if (completionPct === 100) {
                        badgeStyleClass = "text-emerald-400 dark:text-emerald-400 light:text-emerald-800 bg-emerald-950/80 dark:bg-emerald-950/80 light:bg-emerald-100 border border-emerald-500/40 light:border-emerald-300 text-xs font-black";
                    } else if (completionPct >= 80) {
                        badgeStyleClass = "text-amber-300 dark:text-amber-300 light:text-amber-900 bg-amber-500/20 dark:bg-amber-500/20 light:bg-amber-100 border border-amber-500/50 light:border-amber-300 text-xs font-black shadow-sm";
                    } else {
                        badgeStyleClass = "text-rose-400 dark:text-rose-400 light:text-rose-800 bg-rose-500/20 dark:bg-rose-500/20 light:bg-rose-100 border border-rose-500/60 light:border-rose-300 text-sm font-black animate-pulse shadow-lg";
                    }

                    return `
                    <div class="chart-card rounded-2xl p-3 text-center border-l-4 ${theme.border} flex flex-col justify-between space-y-2">
                        <div>
                            <div class="flex items-start justify-between gap-1.5 mb-1.5">
                                <span class="text-[10px] font-extrabold uppercase tracking-wider ${theme.text} text-left whitespace-normal break-words leading-snug flex-1" title="${cat.name}">${cat.name}</span>
                                <span class="text-3xl sm:text-4xl font-black ${theme.text} leading-none shrink-0">${cat.total}</span>
                            </div>

                            <div class="w-full inner-node rounded-xl p-2 border flex items-center justify-between mt-1 shadow-inner">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-700">Completion</span>
                                <span class="${badgeStyleClass} px-2.5 py-0.5 rounded">
                                    ${completionPct}%
                                </span>
                            </div>
                        </div>

                        ${currentSelection === 'COMBINED' ? `
                        <div class="pt-2 border-t border-slate-800 dark:border-slate-800 light:border-slate-200 flex items-center justify-between gap-1">
                            <span class="flex-1 text-center py-0.5 rounded bg-indigo-600 border border-indigo-400 text-white font-black text-xs shadow" title="2G Count">
                                ${cat['2G']}
                            </span>
                            <span class="flex-1 text-center py-0.5 rounded bg-purple-600 border border-purple-400 text-white font-black text-xs shadow" title="LTE Count">
                                ${cat['4G']}
                            </span>
                            <span class="flex-1 text-center py-0.5 rounded bg-emerald-600 border border-emerald-400 text-white font-black text-xs shadow" title="5G Count">
                                ${cat['5G']}
                            </span>
                        </div>
                        ` : ''}
                    </div>
                    `;
                }).join('');
            }

            // 3. RENDER CLEAN CATEGORY NODES WITH LIGHT MODE CONTRAST
            if (gridContainer) {
                gridContainer.className = `grid grid-cols-1 md:grid-cols-${Math.min(5, categories.length)} gap-3 relative`;
                gridContainer.innerHTML = categories.map((cat, idx) => {
                    const theme = COLOR_THEMES[idx % COLOR_THEMES.length];
                    const statusEntries = Object.entries(cat.statusMap);

                    return `
                    <div class="hierarchy-node chart-card rounded-2xl p-3 border-t-4 ${theme.border} space-y-3 flex flex-col justify-between shadow-xl">
                        <div>
                            <div class="flex items-center justify-between gap-1">
                                <h4 class="font-black text-xs md:text-sm whitespace-normal break-words leading-tight text-slate-100 dark:text-slate-100 light:text-slate-900" title="${cat.name}">${cat.name}</h4>
                                <i data-lucide="layers" class="w-3.5 h-3.5 ${theme.text} shrink-0"></i>
                            </div>
                            <div class="text-3xl font-black ${theme.text} mt-1 leading-none">${cat.total}</div>
                        </div>

                        <div class="pt-2 border-t border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 space-y-2">
                            <div class="space-y-1.5 text-[11px] font-medium">
                                ${statusEntries.length === 0 ? `<span class="text-slate-500 italic text-[10px]">No Current Status logged</span>` : 
                                    statusEntries.map(([sName, sData]) => `
                                    <div class="p-2 rounded-xl inner-node space-y-1.5 shadow-sm">
                                        <div class="flex items-center justify-between">
                                            <span class="truncate pr-1 font-bold text-xs leading-tight text-slate-200 dark:text-slate-200 light:text-slate-800" title="${sName}">${sName}</span>
                                            <b class="${theme.badge} font-black text-sm">${sData.total}</b>
                                        </div>

                                        ${currentSelection === 'COMBINED' ? `
                                        <div class="flex items-center justify-between gap-1 pt-1 border-t border-slate-800/60 dark:border-slate-800/60 light:border-slate-300">
                                            <span class="flex-1 text-center px-1 py-0.5 rounded bg-indigo-600 border border-indigo-400 text-white font-extrabold text-xs shadow" title="2G Count">
                                                ${sData['2G']}
                                            </span>
                                            <span class="flex-1 text-center px-1 py-0.5 rounded bg-purple-600 border border-purple-400 text-white font-extrabold text-xs shadow" title="LTE Count">
                                                ${sData['4G']}
                                            </span>
                                            <span class="flex-1 text-center px-1 py-0.5 rounded bg-emerald-600 border border-emerald-400 text-white font-extrabold text-xs shadow" title="5G Count">
                                                ${sData['5G']}
                                            </span>
                                        </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                }).join('');
            }

            // 4. RENDER MATRIX TABLE WITH FULL LIGHT MODE CONTRAST
            const drilldownColumns = Array.from(allRootCauseDrilldowns).sort();
            const tableHeaders = ['Problem / Category', 'Closed Items Count', ...drilldownColumns];

            const tableRows = categories.map(cat => {
                const rowData = [
                    cat.name,
                    cat.closedTotal || 0
                ];

                drilldownColumns.forEach(drillCol => {
                    const valCount = cat.rootCauseMap[drillCol] || 0;
                    rowData.push(valCount);
                });

                return rowData;
            });

            renderTableData(tableHeaders, tableRows);

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        }

        function renderTableData(headers, rows) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');

            if (!headers || headers.length === 0) {
                thead.innerHTML = '<tr><th class="p-3.5">No Headers</th></tr>';
                tbody.innerHTML = '<tr><td class="p-6 text-center text-slate-500">No data available.</td></tr>';
                return;
            }

            thead.innerHTML = `<tr>${headers.map((c, i) => `
                <th class="p-3.5 ${i === 0 ? 'text-left border-r border-slate-800 dark:border-slate-800 light:border-slate-300 font-black text-slate-200 dark:text-slate-200 light:text-slate-900 text-sm' : 'text-center'} ${i === 1 ? 'text-emerald-400 dark:text-emerald-400 light:text-emerald-700 border-r border-slate-800 dark:border-slate-800 light:border-slate-300 bg-emerald-950/20 dark:bg-emerald-950/20 light:bg-emerald-100' : ''}">
                    ${c || ''}
                </th>
            `).join('')}</tr>`;

            tbody.innerHTML = rows.map(row => {
                if (!Array.isArray(row)) return '';
                return `<tr class="hover:bg-slate-900/80 dark:hover:bg-slate-900/80 light:hover:bg-slate-100 transition border-b border-slate-800/60 dark:border-slate-800/60 light:border-slate-200">
                    ${row.map((cell, i) => {
                        if (i === 0) {
                            return `<td class="p-3.5 font-black text-slate-100 dark:text-slate-100 light:text-slate-900 text-sm md:text-base border-r border-slate-800/90 dark:border-slate-800/90 light:border-slate-300">${cell || 0}</td>`;
                        } else if (i === 1) {
                            return `<td class="p-3.5 text-center font-black text-emerald-400 dark:text-emerald-400 light:text-emerald-700 text-base md:text-lg bg-emerald-950/20 dark:bg-emerald-950/20 light:bg-emerald-100 border-r border-slate-800/90 dark:border-slate-800/90 light:border-slate-300">${cell || 0}</td>`;
                        } else {
                            const countVal = Number(cell) || 0;
                            if (countVal > 0) {
                                return `
                                <td class="p-3.5 text-center bg-amber-950/20 dark:bg-amber-950/20 light:bg-amber-100/60 border-r border-slate-800/30 dark:border-slate-800/30 light:border-slate-200">
                                    <span class="inline-block px-3 py-1 rounded-xl bg-amber-500/20 dark:bg-amber-500/20 light:bg-amber-200 border border-amber-500/50 light:border-amber-400 text-amber-400 dark:text-amber-400 light:text-amber-900 font-black text-base md:text-lg shadow-md animate-pulse">
                                        ${countVal}
                                    </span>
                                </td>`;
                            } else {
                                return `<td class="p-3.5 text-center font-bold text-slate-600 dark:text-slate-600 light:text-slate-500 text-sm border-r border-slate-800/30 dark:border-slate-800/30 light:border-slate-200">0</td>`;
                            }
                        }
                    }).join('')}
                </tr>`;
            }).join('');
        }

        function onDropdownChange(value) {
            currentSelection = value;

            const titleEl = document.getElementById('tech-title');
            const legendBox = document.getElementById('tech-legend-box');
            const hierarchyHeading = document.getElementById('hierarchy-heading');

            if (value === 'COMBINED') {
                titleEl.innerText = 'Zero Availability Dashboard';
                hierarchyHeading.innerText = 'Availability Drivers Breakdown (All Summary)';
                if (legendBox) legendBox.classList.remove('hidden');
            } else {
                titleEl.innerText = `${value} Zero Availability Dashboard`;
                hierarchyHeading.innerText = `Availability Drivers Breakdown (${value})`;
                if (legendBox) legendBox.classList.add('hidden');
            }

            calculateKpiCards();
        }
    </script>
</body>
</html>
